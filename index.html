<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Кітап Дала — игровой тренажёр чтения для детей 5–7 лет на казахском, русском и английском языках">
<title>Кітап Дала</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#E3F2F3; --sky:#C9E7EC; --paper:#FBFDFB; --ink:#16303B; --ink-2:#4B6570; --line:#B5D3D8;
  --gold:#E9A826; --gold-deep:#B87E0C; --gold-soft:#FBE7B5; --btn-ink:#2A1C00;
  --turq:#127F86; --turq-deep:#0B5A5F; --turq-soft:#CDEBEA; --on-turq:#FFFFFF;
  --grass:#9CBF6B; --hill:#C4DA96; --mount:#9DBDC8; --sun:#F2B233; --cloud:#FFFFFF;
  --ok:#2E8B57; --ok-soft:#D5F0DF; --no:#C9533A; --stars:0;
  --r-lg:22px; --r-md:14px;
  --f-display:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Andika","Trebuchet MS",Verdana,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1C2A; --sky:#132B40; --paper:#172C3F; --ink:#E7F1F0; --ink-2:#9DB4BC; --line:#2B4A62;
    --gold:#F2BA45; --gold-deep:#A87A12; --gold-soft:#3D3316; --btn-ink:#231800;
    --turq:#46B8B8; --turq-deep:#237C7C; --turq-soft:#17393F; --on-turq:#062020;
    --grass:#3F6A42; --hill:#2E5038; --mount:#2A4A5F; --sun:#F1E6C0; --cloud:#2C4860;
    --ok:#5CC08A; --ok-soft:#17392A; --no:#E0765C; --stars:1;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1C2A; --sky:#132B40; --paper:#172C3F; --ink:#E7F1F0; --ink-2:#9DB4BC; --line:#2B4A62;
  --gold:#F2BA45; --gold-deep:#A87A12; --gold-soft:#3D3316; --btn-ink:#231800;
  --turq:#46B8B8; --turq-deep:#237C7C; --turq-soft:#17393F; --on-turq:#062020;
  --grass:#3F6A42; --hill:#2E5038; --mount:#2A4A5F; --sun:#F1E6C0; --cloud:#2C4860;
  --ok:#5CC08A; --ok-soft:#17392A; --no:#E0765C; --stars:1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-read);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,3.6vw,2.35rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.2rem,2.6vw,1.5rem);font-weight:700}
p{margin:0}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:10px 110px}
.eyebrow{font-family:var(--f-display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--turq);font-weight:700;margin-bottom:6px}
.lead{color:var(--ink-2);max-width:60ch;margin-top:6px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:42px;height:42px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.45rem;display:block;line-height:1.05}
.brand small{display:block;color:var(--ink-2);font-size:.8rem;line-height:1.25}
.bm-disc{fill:var(--gold)} .bm-line{stroke:var(--btn-ink);fill:none}
.nav{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-family:var(--f-display);font-weight:500;font-size:.95rem;color:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--turq);color:var(--on-turq)}
.nav svg{width:20px;height:20px;flex:none}
.langs{display:flex;gap:4px}
.langs button{font-family:var(--f-display);font-weight:700;font-size:.78rem;letter-spacing:.06em;padding:7px 10px;border-radius:10px;border:2px solid var(--line);color:var(--ink-2);background:var(--paper)}
.langs button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.band{height:14px;margin-block:8px 20px;background-repeat:repeat-x;background-size:auto 14px;opacity:.6}
@media (max-width:760px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:18px 18px 0 0;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.1)}
  .nav button{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 8px;border-radius:12px}
  .brand small{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:12px 22px;border-radius:16px;background:var(--gold);color:var(--btn-ink);box-shadow:0 4px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn svg{width:22px;height:22px;flex:none}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.teal{background:var(--turq);color:var(--on-turq);box-shadow:0 4px 0 var(--turq-deep)}
.btn.live{animation:glow 1.2s ease-in-out infinite}
.say{width:64px;height:64px;border-radius:50%;background:var(--turq);color:var(--on-turq);display:grid;place-items:center;box-shadow:0 4px 0 var(--turq-deep);flex:none}
.say svg{width:30px;height:30px}
.say.sm{width:48px;height:48px}.say.sm svg{width:24px;height:24px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* map */
.map-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.map-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:stretch}
@media (max-width:900px){.map-grid{grid-template-columns:1fr}}
.map-card{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--sky)}
.map-card svg{display:block;width:100%;height:auto}
.m-sky{fill:var(--sky)} .m-mount{fill:var(--mount)} .m-hill{fill:var(--hill)} .m-grass{fill:var(--grass)}
.m-snow{fill:var(--paper);opacity:.85} .m-cloud{fill:var(--cloud);opacity:.75} .m-sun{fill:var(--sun)}
.m-star{fill:#FFF6D8;opacity:var(--stars)}
.m-trail{fill:none;stroke:var(--paper);stroke-width:6;stroke-dasharray:1 14;stroke-linecap:round}
.m-trail-done{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round}
.m-label{font-family:var(--f-display);font-weight:700;font-size:17px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.m-shadow{fill:#000;opacity:.12}
.yurt{cursor:pointer}
.yurt .dome{fill:#FBF6EA;stroke:#7B5C3E;stroke-width:2}
.yurt .fband{fill:#C9533A}
.yurt .door{fill:#127F86}
.yurt.locked{cursor:not-allowed}
.yurt.locked .dome{fill:#DCE2E0;stroke:#8C9A9A}.yurt.locked .fband{fill:#AEB9B8}.yurt.locked .door{fill:#8C9A9A}
.yurt .ring{fill:none;stroke:var(--gold);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.yurt:focus-visible{outline:none}.yurt:focus-visible .dome{stroke:var(--gold);stroke-width:4}
.bt-trunk{fill:#E9EEF0;stroke:#7B8B93;stroke-width:1.5}.bt-branch{stroke:#E9EEF0;fill:none;stroke-width:4;stroke-linecap:round}
.bt-sphere{fill:var(--gold)}.bt-glow{fill:var(--gold);opacity:.28}
.m-lock{fill:var(--ink-2)}

.pet-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;justify-content:center}
.pet-card svg{width:180px;height:180px;max-width:100%}
.pet-card h2{font-size:1.3rem}
.meter{width:100%;height:12px;border-radius:99px;background:var(--turq-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .6s}
.small{font-size:.88rem;color:var(--ink-2)}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.wobble{transform-box:fill-box;transform-origin:50% 100%;animation:wob 3.2s ease-in-out infinite}
.grow svg{animation:grow .9s cubic-bezier(.3,1.6,.5,1)}

.stations{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:900px){.stations{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.stations{grid-template-columns:1fr}}
.st{display:grid;grid-template-columns:48px 1fr;gap:2px 12px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.st .num{grid-row:span 3;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:var(--turq-soft);color:var(--turq)}
.st b{font-family:var(--f-display);font-weight:700;font-size:1.02rem}
.st small{color:var(--ink-2);font-size:.86rem;line-height:1.3}
.st .meta{font-size:.8rem;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st .meta .sts{color:var(--gold);letter-spacing:1px;font-size:.95rem}
.st.current{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.st.current .num{background:var(--gold);color:var(--btn-ink)}
.st.done .num{background:var(--turq);color:var(--on-turq)}
.st.locked{opacity:.62;cursor:not-allowed}

/* lesson */
.lesson{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px clamp(16px,3vw,32px) 30px;min-height:520px;position:relative;overflow:hidden}
.l-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.l-top .x{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.l-top .x svg{width:20px;height:20px}
.l-prog{flex:1;height:14px;border-radius:99px;background:var(--turq-soft);overflow:hidden}
.l-prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:inherit;transition:width .5s}
.l-title{font-family:var(--f-display);font-weight:700;color:var(--ink-2);font-size:.9rem}
@media (max-width:540px){.l-title{display:none}}
.prompt{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;margin-block:6px 18px;text-align:center}
.prompt h2{font-size:clamp(1.3rem,3vw,1.8rem)}
.peek{font-family:var(--f-read);font-weight:700;font-size:1.6rem;background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:0 12px}
.pic{font-size:clamp(4rem,13vw,6rem);text-align:center;line-height:1.1}
.bigword{font-family:var(--f-read);font-weight:700;font-size:clamp(3rem,11vw,5.4rem);letter-spacing:.05em;text-align:center;line-height:1.15;border-radius:18px;transition:background .3s}
.bigword.ok{color:var(--ok);background:var(--ok-soft)}
.hint{text-align:center;min-height:2em;font-size:1.4rem;color:var(--ink);margin-top:14px;font-weight:700}
.mic-status{text-align:center;color:var(--ink-2);min-height:1.6em;margin-top:12px;max-width:60ch;margin-inline:auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:640px;margin:0 auto}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:500px;margin-top:22px}
@media (max-width:540px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--ground);border:3px solid var(--line);font-family:var(--f-read);font-weight:700;font-size:clamp(2.6rem,8vw,4.2rem);color:var(--ink);box-shadow:0 5px 0 var(--line);display:flex;align-items:baseline;justify-content:center;gap:.12em;padding-top:.15em;transition:background .2s}
.tiles.three .tile{align-items:center;padding-top:0}
.tile small{font-size:.6em;color:var(--ink-2)}
.tile.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.tile.no{animation:shake .4s;opacity:.4}

.skyfield{position:relative;height:clamp(340px,52vh,440px);border-radius:18px;background:linear-gradient(var(--sky),var(--ground));overflow:hidden;border:1px solid var(--line)}
.balloon{position:absolute;bottom:-140px;left:var(--x);width:clamp(66px,17%,100px);aspect-ratio:.82;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;background:var(--c);display:grid;place-items:center;font-family:var(--f-read);font-weight:700;font-size:clamp(1.5rem,4.5vw,2.1rem);color:#1B2A33;box-shadow:inset -8px -10px 0 rgba(0,0,0,.08),inset 8px 8px 0 rgba(255,255,255,.3);animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:42px;background:rgba(0,0,0,.28)}
.balloon.wrong{animation:rise var(--d) linear infinite,wob2 .45s;animation-delay:var(--dl),0s}

.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:80px;padding:14px;border:3px dashed var(--line);border-radius:18px;max-width:780px;margin:14px auto 0}
.slots.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.chip{font-family:var(--f-read);font-weight:700;font-size:clamp(1.35rem,4vw,1.9rem);padding:6px 18px;border-radius:14px;background:var(--gold-soft);border:2px solid var(--gold);box-shadow:0 4px 0 var(--gold-deep);color:var(--ink)}
.chip.used{visibility:hidden}
.slots .chip{background:var(--paper);border-color:var(--turq);box-shadow:0 3px 0 var(--turq-deep)}
.slots .chip.bad{border-color:var(--no);box-shadow:0 3px 0 var(--no);animation:shake .4s}

.story{max-width:34ch;margin:0 auto;font-family:var(--f-read);font-size:clamp(1.35rem,3.2vw,1.85rem);line-height:1.85}
.story .w{border-radius:8px;padding:0 3px;transition:background .2s,color .2s}
.story .w.on{background:var(--gold-soft);box-shadow:inset 0 -3px 0 var(--gold)}
.story .w.read{color:var(--turq)}
.story-card .story{max-width:40ch}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:800;font-size:1.6rem}
.q{text-align:center;font-size:clamp(1.2rem,3vw,1.6rem);margin-top:26px}
.opt{font-family:var(--f-read);font-weight:700;font-size:1.3rem;padding:12px 20px;border-radius:16px;border:3px solid var(--line);background:var(--ground);box-shadow:0 4px 0 var(--line)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{opacity:.45;animation:shake .4s}
.wpm-line{text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin-top:16px;color:var(--turq)}

.race-bar{display:flex;justify-content:center;gap:24px;align-items:center;flex-wrap:wrap;margin-block:10px 14px;color:var(--ink-2)}
.race{list-style:none;padding:0;margin:0 auto;display:grid;gap:6px;justify-items:center;max-width:420px;transition:filter .3s}
.race.wait{filter:blur(7px)}
.race .w{font-family:var(--f-read);font-weight:700;font-size:clamp(1.45rem,5vw,2rem);padding:2px 18px;border-radius:12px}
.race .w.read{background:var(--turq-soft);color:var(--turq)}
.center{text-align:center;margin-inline:auto}

.result{text-align:center;display:grid;gap:12px;justify-items:center;padding-block:6px}
.bigstars{display:flex;gap:8px}
.bstar{width:clamp(52px,12vw,74px);height:auto;fill:var(--gold)}
.bstar.off{fill:var(--line)}
.result .pet svg{width:170px;height:170px}
.unlock{background:var(--gold-soft);border:2px solid var(--gold);border-radius:14px;padding:8px 16px;font-weight:700}

/* story builder */
.sb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:860px){.sb{grid-template-columns:1fr}}
.groups{display:grid;gap:12px}
.pick-group{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--ground);font-size:1rem;display:flex;gap:6px;align-items:center}
.choice[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:700}
.story-card{background:var(--paper);border:2px solid var(--gold);border-radius:var(--r-lg);padding:22px clamp(16px,3vw,30px);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.story-card .scene{font-size:3rem;letter-spacing:.2em;text-align:center;margin-bottom:8px}

/* dictionary */
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:18px}
.wcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 8px 10px;display:grid;justify-items:center;gap:2px}
.wcard .e{font-size:2.6rem;line-height:1.2}
.wcard b{font-family:var(--f-read);font-size:1.35rem}
.wcard.no{background:transparent;border-style:dashed;cursor:default}
.wcard.no .e{filter:grayscale(1);opacity:.3}
.wcard.no b{color:var(--ink-2);letter-spacing:.2em}
.count-pill{display:inline-block;font-family:var(--f-display);font-weight:700;background:var(--turq-soft);color:var(--turq);border-radius:99px;padding:4px 12px;font-size:.9rem}

/* parents */
.pgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;min-width:0}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:860px){.pgrid>*{grid-column:1/-1}}
.goal-num{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,5vw,2.8rem);font-variant-numeric:tabular-nums;line-height:1.1;margin-block:4px 10px}
.goal-num span{font-size:.45em;color:var(--ink-2);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi b{font-family:var(--f-display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.kpi span{color:var(--ink-2);font-size:.86rem}
.stage-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:10px;align-items:center;padding-block:7px;border-bottom:1px dashed var(--line);font-size:.95rem}
.stage-row:last-child{border-bottom:0}
.stage-row em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;font-size:.85rem}
.chart{margin-top:8px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.c-grid{stroke:var(--line);stroke-width:1}
.c-line{stroke:var(--turq);stroke-width:3;fill:none;stroke-linejoin:round}
.c-area{fill:var(--turq-soft);opacity:.7}
.c-dot{fill:var(--paper);stroke:var(--turq);stroke-width:3}
.c-goal{stroke:var(--gold);stroke-width:2;stroke-dasharray:6 6}
.c-txt{fill:var(--ink-2);font-size:12px;font-family:var(--f-display)}
.c-gtxt{fill:var(--gold-deep);font-size:12px;font-family:var(--f-display);font-weight:700}
.sample .c-line{stroke-dasharray:7 7;opacity:.6}.sample .c-area{opacity:.3}
.tipbox{background:var(--gold-soft);border-color:var(--gold)}
.tipbox p{font-size:1.08rem}

/* ---------- speech ---------- */
const synth=window.speechSynthesis;
let voices=[];
function loadVoices(){try{voices=synth?synth.getVoices():[]}catch(e){voices=[]}}
loadVoices(); try{if(synth)synth.onvoiceschanged=loadVoices}catch(e){}
function pickVoice(code){
 const lc=code.toLowerCase(),p=lc.slice(0,2),vl=v=>(v.lang||'').replace('_','-').toLowerCase();
 return voices.find(v=>vl(v)===lc)||voices.find(v=>vl(v).startsWith(p))||(p==='kk'?voices.find(v=>vl(v).startsWith('ru')):null);
}
function speak(text,o={}){
 if(!synth){o.onend&&o.onend();return}
 try{synth.cancel();const u=new SpeechSynthesisUtterance(text);const code=LANGS[S.lang].code;const v=pickVoice(code);
  if(v){u.voice=v;u.lang=v.lang}else u.lang=code;
  u.rate=o.rate||.85;u.pitch=1.08;
  if(o.onboundary)u.onboundary=o.onboundary;
  u.onend=()=>o.onend&&o.onend();
  synth.speak(u);
 }catch(e){o.onend&&o.onend()}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=false, rec=null;
const micOK=()=>!!SR&&!micBlocked;
function stopRec(){if(rec){try{rec.onend=null;rec.abort()}catch(e){}rec=null}}
function listen({continuous=false,onText,onEnd,onError}){
 const r=new SR();r.lang=LANGS[S.lang].code;r.interimResults=true;r.continuous=continuous;r.maxAlternatives=3;
 r.onresult=e=>{let best='',all=[];for(let i=0;i<e.results.length;i++){best+=' '+e.results[i][0].transcript;for(let k=0;k<e.results[i].length;k++)all.push(e.results[i][k].transcript)}onText&&onText(best.trim(),all.join(' '))};
 r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture','language-not-supported'].includes(e.error))micBlocked=true;onError&&onError(e.error)};
 r.onend=()=>onEnd&&onEnd();
 try{r.start()}catch(e){micBlocked=true;setTimeout(()=>onError&&onError('start'),0)}
 rec=r;return r;
}
const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
const near=(h,w)=>h===w||(w.length>=4&&lev(h,w)<=1);
function matchWord(txt,w){const n=norm(w);return norm(txt).split(' ').some(h=>near(h,n))}

/* follow reading along spans with the mic */
function follow(spans,onProgress){
 const targets=spans.map(s=>norm(s.textContent));let pos=0,active=true;
 const run=()=>{const base=pos;
  listen({continuous:true,
   onText:(best)=>{let p=base;for(const h of norm(best).split(' ')){for(let k=p;k<Math.min(p+3,targets.length);k++){if(near(h,targets[k])){p=k+1;break}}}
    if(p>pos){for(let k=0;k<p;k++)spans[k].classList.add('read');pos=p;onProgress&&onProgress(pos)}},
   onEnd:()=>{if(active&&!micBlocked)run()},onError:()=>{}});
 };
 run();
 return ()=>{active=false;stopRec()};
}
function speakHL(spans,onend){
 const offs=[];let c=0;spans.forEach(s=>{offs.push(c);c+=s.textContent.length+1});
 const text=spans.map(s=>s.textContent).join(' ');
 const clear=()=>spans.forEach(s=>s.classList.remove('on'));
 speak(text,{rate:.8,onboundary:e=>{if(e.name&&e.name!=='word')return;let idx=0;for(let i=0;i<offs.length;i++)if(offs[i]<=e.charIndex)idx=i;clear();spans[idx]&&spans[idx].classList.add('on')},onend:()=>{clear();onend&&onend()}});
}

function burst(el){

function gate(ok){

/* ---------- lessons ---------- */
function buildRounds(si){
 const d=D(),p=P();
 if(si===0)return sample(d.letters,8).map(item=>({type:'letter',item,opts:shuffle([item.L,...sample(d.letters.filter(x=>x.L!==item.L),3).map(x=>x.L)])}));
 if(si===1)return sample(d.syl,8).map(item=>({type:'syl',item,pool:shuffle([item,...sample(d.syl.filter(x=>x!==item),4)])}));
 if(si===2)return sample(d.words,8).map((item,k)=>({type:k%2?'read':'pick',item,opts:shuffle([item,...sample(d.words.filter(x=>x!==item),2)])}));
 if(si===3)return sample(d.phrases,5).map(item=>({type:'phrase',item}));
 if(si===4)return [{type:'story',item:d.stories[p.lessons[4]%d.stories.length]}];
 return [{type:'race',items:sample(d.words,10).sort((a,b)=>a.w.length-b.w.length)}];
}
function startLesson(si){
 if(!unlocked(si)){const tt=t();toast(fmt(tt.locked,{prev:tt.stations[si-1].n}));return}
 if(overLimit())return showBreak(()=>startLesson(si));
 go('lesson');
 L={si,i:0,correct:0,miss:0,wpm:null,start:Date.now(),rounds:buildRounds(si)};
 const tt=t();
 $('#scr-lesson').innerHTML=`<div class="lesson"><div class="l-top"><button class="x" id="lx" aria-label="${esc(tt.close)}">${I.x}</button><div class="l-prog"><i id="lprog"></i></div><span class="l-title">${si+1}. ${esc(tt.stations[si].n)}</span></div><div id="lbody"></div></div>`;
 $('#lx').onclick=()=>go('map');
 armLimit();nextRound();
}
function armLimit(){clearInterval(limitTick);limitTick=setInterval(()=>{if(screen==='lesson'&&L&&L.start&&overLimit()){endTiming();stopAll();showBreak(()=>{L.start=Date.now();armLimit();nextRound()})}},15000)}
function nextRound(){if(L.i>=L.rounds.length)return finish();$('#lprog').style.width=(L.i/L.rounds.length*100)+'%';const r=L.rounds[L.i];r.done=false;R[r.type](r,$('#lbody'),t())}

  <div class="race-bar"><span class="timer" id="tm">0.0</span><span>${esc(tt.record)}: <b>${best||'—'}</b> ${esc(tt.wpm)}</span></div>
  <ol class="race wait" id="rc">${r.items.map(w=>`<li><span class="w">${esc(w.w)}</span></li>`).join('')}</ol>
  <div class="row"><button class="btn" id="go">${I.play} ${esc(tt.start)}</button></div><div class="mic-status" id="ms" aria-live="polite"></div>`;
  const spans=$$('#rc .w'),ms=$('#ms');let t0=0,iv;
  $('#go').onclick=()=>{
   if(!t0){t0=Date.now();$('#rc').classList.remove('wait');$('#go').innerHTML=`${I.check} ${esc(tt.finish)}`;$('#go').classList.add('teal');
    iv=setInterval(()=>{$('#tm').textContent=((Date.now()-t0)/1000).toFixed(1)},100);intervals.push(iv);
    if(micOK())stopFollow=follow(spans,pos=>{if(pos>=spans.length)$('#go').click()});
   }else if(!r.done){
    r.done=true;clearInterval(iv);if(stopFollow){stopFollow();stopFollow=null}
    const sec=Math.max(1,(Date.now()-t0)/1000);spans.forEach(x=>x.classList.add('read'));
    L.wpm=Math.min(150,Math.round(r.items.length/(sec/60)));L.correct+=r.items.length;r.items.forEach(addWord);
    ms.innerHTML=`<p class="wpm-line">${fmt(tt.speed,{n:L.wpm})}${L.wpm>best&&best?` · ${esc(tt.newRecord)}`:''}</p>`;
    $('#go').hidden=true;praise($('#rc'));advance(2600);
   }
  };
 }
};

function finish(){
 endTiming();
 const p=P(),tt=t(),si=L.si;
 const stars=L.miss===0?3:L.miss<=2?2:1;
 const wasOpen=si<5&&unlocked(si+1),before=petStage(S.fed);
 p.lessons[si]++;p.stars[si].push(stars);p.log.push({d:today(),s:si,st:stars});
 if(L.wpm)p.wpm.push({d:today(),v:L.wpm});
 S.fed+=L.correct;save();
 const after=petStage(S.fed),opened=si<5&&!wasOpen&&unlocked(si+1);
 $('#lprog').style.width='100%';
 $('#lbody').innerHTML=`<div class="result">
  <div class="bigstars">${[1,2,3].map(k=>I.star(k<=stars)).join('')}</div>
  <h1>${esc(tt.resultTitle)}</h1>
  <p>${fmt(tt.fed,{n:L.correct})}${L.wpm?' · '+fmt(tt.speed,{n:L.wpm}):''}</p>
  <div class="pet ${after>before?'grow':''}">${petSVG(after)}</div>
  <p><b>${esc(tt.pet.names[after])}</b></p>
  ${opened?`<p class="unlock">${fmt(tt.opened,{n:esc(tt.stations[si+1].n)})}</p>`:''}
  <div class="row"><button class="btn alt" id="again">${esc(tt.again)}</button><button class="btn" id="tomap">${esc(tt.back)}</button></div>
 </div>`;
 speak(tt.resultTitle);later(()=>burst($('.bigstars')),200);
 $('#again').onclick=()=>startLesson(si);$('#tomap').onclick=()=>go('map');
}

/* ---------- story builder ---------- */
const SB={hero:0,place:0,object:0,action:0};
function tale(){const b=D().builder,g=k=>b[k][SB[k]%b[k].length].t,h=g('hero');
 return b.tpl.replace('{place}',g('place')).replace('{hero}',h).replace('{object}',g('object')).replace('{action}',g('action')).replace('{Hero}',h.charAt(0).toUpperCase()+h.slice(1))}
function renderStory(){
 const tt=t(),b=D().builder,keys=['hero','place','object','action'];
 const text=tale(),scene=keys.map(k=>b[k][SB[k]].e).join(' ');
 $('#scr-story').innerHTML=`
 <div class="map-head"><div><p class="eyebrow">${esc(tt.nav.story)}</p><h1>${esc(tt.story.title)}</h1><p class="lead">${esc(tt.story.lead)}</p></div></div>
 <div class="sb">
  <div class="groups">${keys.map(k=>`<div class="pick-group"><p class="eyebrow">${esc(tt.story[k])}</p><div class="choices">${b[k].map((c,i)=>`<button class="choice" data-k="${k}" data-i="${i}" aria-pressed="${SB[k]===i}"><span aria-hidden="true">${c.e}</span>${esc(c.t)}</button>`).join('')}</div></div>`).join('')}</div>
  <article class="story-card"><p class="eyebrow">${esc(tt.story.yours)}</p><div class="scene" aria-hidden="true">${scene}</div>
   <p class="story" id="tale">${text.split(' ').map(w=>`<span class="w">${esc(w)}</span>`).join(' ')}</p>
   <div class="row"><button class="btn" id="tell">${I.speak} ${esc(tt.story.tell)}</button>${micOK()?`<button class="btn teal" id="self">${I.mic} ${esc(tt.story.readSelf)}</button>`:''}</div>
  </article>
 </div>`;
 $$('.choice').forEach(c=>c.onclick=()=>{SB[c.dataset.k]=+c.dataset.i;stopAll();renderStory()});
 const spans=$$('#tale .w');
 $('#tell').onclick=()=>{if(stopFollow){stopFollow();stopFollow=null}speakHL(spans)};
 const self=$('#self');
 if(self)self.onclick=()=>{if(stopFollow){stopFollow();stopFollow=null;self.classList.remove('live');return}
  try{synth&&synth.cancel()}catch(e){}spans.forEach(s=>s.classList.remove('read'));self.classList.add('live');
  stopFollow=follow(spans,pos=>{if(pos>=spans.length){stopFollow&&stopFollow();stopFollow=null;self.classList.remove('live');S.fed+=3;save();praise($('#tale'))}})};
}

/* ---------- dictionary ---------- */
function renderDict(){
 const tt=t(),p=P(),words=D().words,known=words.filter(w=>p.words.includes(w.w)).length;
 $('#scr-dict').innerHTML=`
 <div class="map-head"><div><p class="eyebrow">${esc(tt.nav.dict)}</p><h1>${esc(tt.dict.title)}</h1><p class="lead">${esc(tt.dict.lead)}</p></div><span class="count-pill">${fmt(tt.dict.count,{n:known,m:words.length})}</span></div>
 <div class="dict">${words.map(w=>p.words.includes(w.w)?`<button class="wcard" data-say="${esc(w.w)}"><span class="e" aria-hidden="true">${w.e}</span><b>${esc(w.w)}</b></button>`:`<div class="wcard no"><span class="e" aria-hidden="true">${w.e}</span><b>${'•'.repeat(Math.min(w.w.length,6))}</b></div>`).join('')}</div>`;
 $$('[data-say]').forEach(c=>c.onclick=()=>{speak(c.dataset.say);burst(c)});
}

/* ---------- parents ---------- */
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function streak(log){const set=new Set(log.map(l=>l.d));const d=new Date();if(!set.has(dstr(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(dstr(d))){n++;d.setDate(d.getDate()-1)}return n}
function chartSVG(p,goal,tt){
 const now=weekStart(new Date()),weeks=[];
 for(let k=5;k>=0;k--){const s=new Date(now);s.setDate(s.getDate()-7*k);weeks.push(s)}
 let vals=weeks.map((w,k)=>{const e=new Date(w);e.setDate(e.getDate()+7);const v=p.wpm.filter(x=>{const d=new Date(x.d+'T12:00');return d>=w&&d<e}).map(x=>x.v);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null});
 const sample=vals.every(v=>v===null);
 if(sample)vals=[Math.round(goal*.2),Math.round(goal*.3),Math.round(goal*.36),Math.round(goal*.48),Math.round(goal*.55),Math.round(goal*.66)];
 const W=560,H=230,l=40,r=18,tp=18,bt=34,max=Math.ceil(Math.max(goal*1.15,...vals.filter(v=>v!==null))/10)*10;
 const x=k=>l+k*(W-l-r)/5,y=v=>tp+(H-tp-bt)*(1-v/max);
 const pts=vals.map((v,k)=>v===null?null:[x(k),y(v)]).filter(Boolean);
 const grid=[0,max/2,max].map(v=>`<line class="c-grid" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text class="c-txt" x="${l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
 const xl=weeks.map((w,k)=>`<text class="c-txt" x="${x(k)}" y="${H-12}" text-anchor="middle">${pad(w.getDate())}.${pad(w.getMonth()+1)}</text>`).join('');
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 const area=pts.length>1?`<path class="c-area" d="${line} L${pts[pts.length-1][0]},${y(0)} L${pts[0][0]},${y(0)}Z"/>`:'';
 const last=pts[pts.length-1];
 return `<div class="chart ${sample?'sample':''}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tt.par.speedT)}">${grid}
  <line class="c-goal" x1="${l}" x2="${W-r}" y1="${y(goal)}" y2="${y(goal)}"/><text class="c-gtxt" x="${W-r}" y="${y(goal)-6}" text-anchor="end">${esc(tt.par.goalLbl)} ${goal}</text>
  ${area}${pts.length?`<path class="c-line" d="${line}"/>`:''}${pts.map((p,i)=>`<circle class="c-dot" cx="${p[0]}" cy="${p[1]}" r="${p===last?6:4}"/>`).join('')}
  ${last?`<text class="c-txt" x="${last[0]}" y="${last[1]-12}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">${vals.filter(v=>v!==null).pop()}</text>`:''}
  ${xl}</svg></div>${sample?`<p class="small">${esc(tt.par.sample)}</p>`:''}`;
}
function renderParents(){
 const tt=t(),pt=tt.par,p=P(),goal=D().goal,best=Math.max(0,...p.wpm.map(x=>x.v));
 const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
 $('#scr-parents').innerHTML=`
 <div class="map-head"><div><p class="eyebrow">${esc(LANGS[S.lang].name)}</p><h1>${esc(pt.title)}</h1></div></div>
 <div class="pgrid">
  <section class="panel s8"><p class="eyebrow">${esc(pt.goal)}</p>
   <p class="goal-num">${best} <span>/ ${goal} ${esc(tt.wpm)}</span></p>
   <div class="meter"><i style="width:${Math.min(100,Math.round(best/goal*100))}%"></i></div>
   <p class="small" style="margin-top:10px">${fmt(pt.goalText,{n:goal})}</p></section>
  <section class="panel s4 tipbox"><p class="eyebrow">${esc(pt.tip)}</p><p>${esc(tt.tips[doy%tt.tips.length])}</p></section>
  <section class="panel s12 kpis">
   <div class="kpi"><b>${p.words.length}</b><span>${esc(pt.words)}</span></div>
   <div class="kpi"><b>${p.log.length}</b><span>${esc(pt.lessons)}</span></div>
   <div class="kpi"><b>${best||'—'}</b><span>${esc(pt.best)}, ${esc(tt.wpm)}</span></div>
   <div class="kpi"><b>${streak(p.log)}</b><span>${esc(pt.streak)}</span></div>
  </section>
  <section class="panel s7"><h2>${esc(pt.speedT)}</h2>${chartSVG(p,goal,tt)}</section>
  <section class="panel s5"><h2>${esc(pt.stages)}</h2><div style="margin-top:8px">${tt.stations.map((s,i)=>{const n=Math.min(p.lessons[i],LESSONS_PER);return `<div class="stage-row"><span>${i+1}. ${esc(s.n)}</span><div class="meter"><i style="width:${n/LESSONS_PER*100}%"></i></div><em>${n}/${LESSONS_PER}</em></div>`}).join('')}</div></section>
  <section class="panel s12"><h2>${esc(pt.settings)}</h2>
   <div class="form">
    <label class="f" for="set-name">${esc(pt.name)}<input id="set-name" value="${esc(S.name)}" maxlength="24" placeholder="Айя"></label>
    <label class="f" for="set-lang">${esc(pt.lang)}<select id="set-lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===S.lang?'selected':''}>${v.name}</option>`).join('')}</select></label>
    <label class="f" for="set-sess">${esc(pt.session)}<select id="set-sess">${[10,15,20,30].map(m=>`<option value="${m}" ${m===S.session?'selected':''}>${m} ${esc(pt.min)}</option>`).join('')}</select></label>
   </div>
   <p class="small" style="margin-top:14px;max-width:80ch">${esc(pt.speech)}</p>
   <div class="row" style="justify-content:flex-start"><button class="btn alt" id="set-reset">${esc(pt.reset)}</button></div>
  </section>
 </div>`;
 $('#set-name').oninput=e=>{S.name=e.target.value.trim();save()};
 $('#set-lang').onchange=e=>setLang(e.target.value);
 $('#set-sess').onchange=e=>{S.session=+e.target.value;save()};
 const rb=$('#set-reset');let armed=false;
 rb.onclick=()=>{if(!armed){armed=true;rb.textContent=pt.sure;return}delete S.langs[S.lang];save();toast(pt.resetOk);renderParents()};
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
 const pl=e.target.closest('[data-play]');if(pl){startLesson(+pl.dataset.play);return}
 const n=e.target.closest('[data-go]');if(n){go(n.dataset.go);return}
 const lg=e.target.closest('[data-lang]');if(lg)setLang(lg.dataset.lang);
});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('g[data-play]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();startLesson(+g.dataset.play)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='lesson'&&L&&L.start){endTiming()}else if(!document.hidden&&screen==='lesson'&&L&&!L.start&&$('#overlay').hidden&&!$('.result')){L.start=Date.now();armLimit()}});

const orn=`<svg xmlns="http://www.w3.org/2000/svg" width="44" height="14" viewBox="0 0 44 14"><path d="M22 13 V8 C22 2 14 1 12 5 C10 9 15 10 16 7 M22 8 C22 2 30 1 32 5 C34 9 29 10 28 7 M0 13 H44" fill="none" stroke="#127F86" stroke-width="1.6" stroke-linecap="round"/></svg>`;
$('.band').style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(orn)}")`;

renderChrome();go('map');
})();
</script>
